{% extends "admin/base.html" %}

{% block title %}Edit {{ event.name }} | ShowSpot Admin{% endblock %}

{% block content %}
<div class="admin-page-container">
    <div class="admin-page-header">
        <div>
            <h1><i class="fa-solid fa-pen-to-square"></i> Edit Event</h1>
            <p>Modify event metadata, schedule, and activation status</p>
        </div>
        <a href="{{ url_for('admin.admin_events') }}" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back to Events
        </a>
    </div>

    <div class="admin-panel-card" style="max-width: 900px; margin: 0 auto;">
        <form action="{{ url_for('admin.admin_edit_event', event_id=event.id) }}" method="POST" class="admin-form">
            <div class="form-group">
                <label for="eventName">Event Name</label>
                <input type="text" id="eventName" name="name" class="form-control" value="{{ event.name }}" required>
            </div>

            <div class="form-group">
                <label for="eventDescription">Description</label>
                <textarea id="eventDescription" name="description" class="form-control" rows="4" required>{{ event.description }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group col-half">
                    <label for="status">Event Status</label>
                    <select id="status" name="status" class="form-control">
                        <option value="ACTIVE" {% if event.status == 'ACTIVE' %}selected{% endif %}>ACTIVE</option>
                        <option value="CANCELLED" {% if event.status == 'CANCELLED' %}selected{% endif %}>CANCELLED</option>
                        <option value="COMPLETED" {% if event.status == 'COMPLETED' %}selected{% endif %}>COMPLETED</option>
                        <option value="DRAFT" {% if event.status == 'DRAFT' %}selected{% endif %}>DRAFT</option>
                    </select>
                </div>

                <div class="form-group col-half">
                    <label for="bannerImage">Banner Image URL</label>
                    <input type="text" id="bannerImage" name="banner_image" class="form-control" value="{{ event.banner_image }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-half">
                    <label for="venue">Venue / Stadium</label>
                    <input type="text" id="venue" name="venue" class="form-control" value="{{ event.venue }}" required>
                </div>

                <div class="form-group col-half">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" class="form-control" value="{{ event.city }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-half">
                    <label for="eventDate">Event Date</label>
                    <input type="date" id="eventDate" name="event_date" class="form-control" value="{{ event.event_date.strftime('%Y-%m-%d') }}" required>
                </div>

                <div class="form-group col-half">
                    <label for="eventTime">Showtime</label>
                    <input type="time" id="eventTime" name="event_time" class="form-control" value="{{ event.event_time.strftime('%H:%M') }}" required>
                </div>
            </div>

            <div class="form-actions-bar" style="margin-top: 2rem;">
                <a href="{{ url_for('admin.admin_events') }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Save Changes</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
